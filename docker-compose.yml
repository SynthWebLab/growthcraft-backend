version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: growthcraft-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  mongodb:
    image: mongo:7
    container_name: growthcraft-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: growthcraft
      MONGO_INITDB_ROOT_PASSWORD: growthcraft123
      MONGO_INITDB_DATABASE: growthcraft
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
  mongo_data:

