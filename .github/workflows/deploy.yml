name: Deploy to EC2 (Developer Branch)

on:
  push:
    branches:
      - developer

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/developer'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > backend/.env

      - name: Install dependencies and build
        run: |
          cd backend
          npm ci
          npm run build

      - name: Transfer Files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/dist,backend/.env,backend/package.json,backend/package-lock.json"
          target: "/home/ubuntu/growthcraft-backend"
          strip_components: 1

      - name: Execute Deployment on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/growthcraft-backend

            # Install dependencies
            npm ci

            # Restart the systemd service
            sudo systemctl daemon-reload
            sudo systemctl restart growth-backend
